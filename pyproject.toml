[project]
name = "api-flota-mid"
version = "0.1.0"
description = "MID de Flota (recomendación de vehículos y alertas operativas) del clúster Rodar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.5,<2",
    "asgi-lifespan>=2.1,<3",
]

[tool.uv]
# Es una aplicación, no una librería instalable.
package = false
